name: Research
description: Define a question, experiment, and expected evidence.
title: "[Research]: "
labels:
  - "type:research"
body:
  - type: markdown
    attributes:
      value: |
        Research is experimental. Its results do not automatically become
        production code or change a frozen decision.
  - type: textarea
    id: question
    attributes:
      label: Question or Hypothesis
      description: What specific question will this work answer or test?
    validations:
      required: true
  - type: textarea
    id: importance
    attributes:
      label: Why It Matters
      description: Which product or engineering decision could this evidence inform?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: Describe the experiment, comparison, or investigation.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics
      description: Define the measurements and decision thresholds.
    validations:
      required: true
  - type: textarea
    id: expected-output
    attributes:
      label: Expected Output
      description: Describe the artifact or evidence this research will produce.
    validations:
      required: true
  - type: textarea
    id: production-impact
    attributes:
      label: Production Impact
      description: Explain how results could affect production, or write "None".
    validations:
      required: true
