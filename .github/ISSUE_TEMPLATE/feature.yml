name: Feature
description: Propose a scoped product or engineering capability.
title: "[Feature]: "
labels:
  - "type:feature"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a specific, verifiable capability. Keep the proposal
        within accepted product and architecture decisions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or unmet need does this address?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this work achieve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What work is included?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List objective conditions that must be satisfied.
      placeholder: |
        - [ ] Observable result one
        - [ ] Observable result two
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List prerequisite issues, decisions, or systems. Write "None" if there are none.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: State what this issue deliberately excludes. Write "None" if nothing is excluded.
    validations:
      required: true
