name: Android foundation

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'docs/api/fixtures/learning-lifecycle-v1.json'
      - 'docs/api/fixtures/m6-v1.json'
      - 'docs/api/schemas/m6-v1.schema.json'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'docs/api/fixtures/learning-lifecycle-v1.json'
      - 'docs/api/fixtures/m6-v1.json'
      - 'docs/api/schemas/m6-v1.schema.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      EMBYR_API_BASE_URL: https://api.example.invalid/
      SUPABASE_URL: https://supabase.example.invalid/
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate canonical M6 schema examples
        run: |
          python -m pip install -r tools/requirements-contracts.txt
          python tools/validate_m6_public_examples.py
      - name: Lint, unit tests, and debug/release assemblies
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
