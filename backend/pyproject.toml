[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "embyr-persistence"
version = "0.1.0"
description = "Embyr persistence models and migration tooling"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.14,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "storage3>=2.31,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.setuptools.packages.find]
where = [".", ".."]
include = ["app*", "research", "research.recommendation", "research.recommendation.simulator"]

[tool.setuptools.package-data]
"app.recommendation" = ["profiles/*.json"]
"app.learning" = ["packages/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests", "../database/tests"]
